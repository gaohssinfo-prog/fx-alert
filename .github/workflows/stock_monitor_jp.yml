name: 📈 日本株監視 (1458/1459)

on:
  workflow_dispatch: # 手動テスト用ボタン
  
  repository_dispatch:     
    # 外部からのWebhookを受け付けるための専用ID
    types: [trigger-stock-jp]   

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: 日本株監視スクリプトの実行
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python stock_monitor_jp.py

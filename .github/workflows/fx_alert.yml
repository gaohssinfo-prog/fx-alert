name: FX Signal Hourly Check (H4+H1)

on:
  schedule:
    # 核心优化：避开整点未收盘陷阱，延后 1 分钟在每小时的 01 分执行 (基于 UTC，周一至周五)
    - cron: '1 * * * 1-5'
  
  workflow_dispatch: # 允许手动点击触发测试

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: 执行策略监控脚本
        env:
          # 读取你在 Secrets 中配置的 Bark 推送 Key
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python fx_monitor.py
